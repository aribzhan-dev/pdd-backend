[pytest]
testpaths = tests
# tests/ has no __init__.py, so pytest puts that directory on sys.path rather
# than the project root — and then neither `app` nor `tests.conftest` can be
# imported. Naming the root here fixes both, and keeps plain `pytest` working
# the same as `python -m pytest`.
pythonpath = .
asyncio_mode = auto
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
